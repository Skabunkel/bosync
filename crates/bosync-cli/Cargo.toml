[package]
name = "bosync-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "bosync"
path = "src/main.rs"

[dependencies]
bosync-git = { path = "../bosync-git" }
bosync-core = { path = "../bosync-core" }
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true

# Used only by the Windows `mount` command (watcher + Ctrl-C handling).
[target.'cfg(windows)'.dependencies]
bosync-windows = { path = "../bosync-windows" }
ctrlc.workspace = true
notify.workspace = true
