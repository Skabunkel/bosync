[workspace]
resolver = "2"
members = [
    "crates/bosync-git",
    "crates/bosync-sync",
    "crates/bosync-windows",
    "crates/bosync-linux",
    "crates/bosync-core",
    "crates/bosync-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["GitDrive POC"]

[workspace.dependencies]
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Pure-Rust git. Default features are pure Rust (no libgit2, no C zlib).
# `tree-editor` adds Repository::edit_tree for building trees to commit.
# `blocking-network-client` enables shallow clone / fetch over git:// and ssh:// (ssh uses
# the OS ssh program). `blocking-http-transport-reqwest-rust-tls` adds http(s) with rustls —
# pure-Rust TLS, so the only non-Rust transport is the OS's own ssh binary.
gix = { version = "0.84", features = [
    "tree-editor",
    "worktree-mutation",
    "blocking-network-client",
    "blocking-http-transport-reqwest-rust-tls",
] }
# Safe wrapper over the Windows Cloud Filter API (cldapi.dll). Windows-only; pulled in only
# by bosync-windows under a cfg(windows) target dependency.
cloud-filter = "0.0.6"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
# Pure-Rust filesystem watcher (ReadDirectoryChangesW on Windows) — drives write-back.
notify = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pure-Rust text diffing for patch generation (version X -> current Y).
similar = "2"
# Linux FUSE bindings. default-features=false drops the libfuse C linkage; fuser then mounts
# via the `fusermount3` helper, keeping the dependency Rust-only.
fuser = { version = "0.15", default-features = false }
libc = "0.2"
