[workspace]
resolver = "2"
members = [
    "crates/bosync-git",
    "crates/bosync-sync",
    "crates/bosync-cf",
    "crates/bosync-core",
    "crates/bosync-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["GitDrive POC"]

[workspace.dependencies]
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Pure-Rust git. Default features are pure Rust (no libgit2, no C zlib).
# `tree-editor` adds Repository::edit_tree for building trees to commit.
gix = { version = "0.84", features = ["tree-editor"] }
# Safe wrapper over the Windows Cloud Filter API (cldapi.dll).
cloud-filter = "0.0.6"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
# Pure-Rust filesystem watcher (ReadDirectoryChangesW on Windows) — drives write-back.
notify = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pure-Rust text diffing for patch generation (version X -> current Y).
similar = "2"
